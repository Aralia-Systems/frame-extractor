[pytest]
# Pytest configuration for frame-extractor tests

testpaths = testing
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short

# Markers for test categorization
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    realdata: marks tests that use committed files under test_data/
    slow: marks tests as slow (deselect with '-m "not slow"')
    skipif: conditional skip marker

# Logging configuration
log_cli = false
log_cli_level = INFO
log_file = testing/test_results.log
log_file_level = DEBUG
